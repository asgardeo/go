        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      tags:
        - Purpose Category
    delete:
      description: |
        This API is used to delete a purpose category.
      x-wso2-request: >
        curl -k -X DELETE
        "https://localhost:9443/api/identity/consent-mgt/v1.0/consents/purpose-categories/<Purpose_Category_ID>"
        -H "Authorization: Basic <Base64Encoded[username:password]>" -H "accept:
        application/json"
      x-wso2-curl: >
        curl -k -X DELETE
        "https://localhost:9443/api/identity/consent-mgt/v1.0/consents/purpose-categories/1"
        -H "Authorization: Basic YWRtaW46YWRtaW4=" -H "accept: application/json"
      x-wso2-response: |
        "HTTP/1.1 200 Ok"
      summary: |
        Delete purpose category
      parameters:
        - name: purposeCategoryId
          in: path
          description: Unique ID of the purpose category
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "400":
