servers:
  - url: /t/{tenant-domain}/api/identity/consent-mgt/v1.0
    variables:
      tenant-domain:
        default: unknown
components:
  parameters:
    receiptId:
      name: receiptId
      in: path
      description: The unique identifier of a receipt
      required: true
      schema:
        type: string
    limit:
      name: limit
      in: query
      description: Number of search results
      required: false
      schema:
        type: integer
    offset:
      name: offset
      in: query
      description: Start index of the search
      required: false
      schema:
        type: integer
    service:
      x-go-name: ServiceQueryParam
      name: service
      in: query
      description: Service name
      required: false
      schema:
        type: string
    state:
      name: state
      in: query
      description: State (ACTIVE/REVOKED)
      required: false
      schema:
        type: string
    spTenantDomain:
      name: spTenantDomain
      in: query
      description: Service provider tenant domain
      required: false
      schema:
        type: string
    piiPrincipalId:
      name: piiPrincipalId
      in: query
      description: Subject identifier
      required: false
      schema:
        type: string
    consentIdQuery:
      name: consent-id
      in: query
      description: The unique identifier of a consent
      required: false
      schema:
        type: string
    collectionMethod:
      name: collectionMethod
      in: query
      description: Collection method of the consent
      required: false
      schema:
        type: string
    piiCategoryId:
      name: piiCategoryId
      in: query
      description: ID of PII Category that will be shared as understood by the PII Principal
      required: false
      schema:
        type: string
    next:
      name: next
      in: query
      description: Next result set
      required: false
      schema:
        type: string
    previous:
      name: previous
      in: query
      description: Previous result set
      required: false
      schema:
        type: string
    group:
      name: group
      in: query
      description: Purpose group
      required: false
      schema:
        type: string
    groupType:
      name: groupType
      in: query
      description: Type of the purpose group
      required: false
      schema:
        type: string
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        description:
          type: string
        traceId:
          type: string
    ConsentRequest:
      type: object
      properties:
        services:
          type: array
          items:
            $ref: "#/components/schemas/service"
        collectionMethod:
          type: string
        jurisdiction:
          type: string
        language:
          type: string
        policyURL:
          type: string
        properties:
          type: array
          items:
            $ref: "#/components/schemas/Property"
    PurposeRequest:
      type: object
      required:
        - purpose
      properties:
        purpose:
          type: string
        description:
          type: string
        group:
          type: string
        groupType:
          type: string
        piiCategories:
          type: array
          items:
            $ref: "#/components/schemas/purposePiiCategoryRequest"
    purposePiiCategoryRequest:
      type: object
      properties:
        piiCategoryId:
          type: integer
        mandatory:
          type: boolean
    PIIcategoryRequest:
      type: object
      required:
        - piiCategory
      properties:
        piiCategory:
          type: string
        description:
          type: string
        displayName:
          type: string
        sensitive:
          type: boolean
    PurposeCategoryRequest:
      type: object
      required:
        - purposeCategory
      properties:
        purposeCategory:
          type: string
        description:
          type: string
    purposes:
      type: array
      items:
        $ref: "#/components/schemas/purposeListResponse"
    purpseCategories:
      type: array
      items:
        $ref: "#/components/schemas/purposeCategoryListResponse"
    piiCategories:
      type: array
      items:
        $ref: "#/components/schemas/piiCategoryListResponse"
    Property:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
    ConsentAddResponse:
      type: object
      required:
        - consentReceiptID
        - piiPrincipalId
        - tenantDomain
      properties:
        consentReceiptID:
          type: string
        language:
          type: string
        piiPrincipalId:
          type: string
        tenantDomain:
          type: string
    ConsentResponse:
      type: object
      required:
        - consentReceiptID
        - piiPrincipalId
        - tenantDomain
      properties:
        consentReceiptID:
          type: string
        language:
          type: string
        piiPrincipalId:
          type: string
        tenantDomain:
          type: string
        state:
          type: string
        spDisplayName:
          type: string
        spDescription:
          type: string
    ConsentReceipt:
      type: object
      required:
        - version
        - jurisdiction
        - consentTimestamp
        - collectionMethod
        - consentReceiptID
        - piiPrincipalId
        - piiControllers
        - policyUrl
        - services
        - sensitive
        - spiCat
      properties:
        version:
          type: string
          description: The version of this specification to which a receipt conforms. The
            value MUST be “KI-CR-v1.1.0” for this version of the specification.
        jurisdiction:
          type: string
          description: The jurisdiction(s) applicable to this transaction.
        consentTimestamp:
          type: integer
          format: int64
          description: Date and time of the consent transaction. The JSON value is
            expressed as the number of seconds since 1970-01-01 00:00:00 GMT
        collectionMethod:
          type: string
          description: A description of the method by which consent was obtained.
        consentReceiptID:
          type: string
          description: A unique number for each Consent Receipt.
        publicKey:
          type: string
          description: The PII Controller’s public key.
        language:
          type: string
          description: Language in which the consent was obtained as for ISO 639-1:2002
            [ISO 639].
        piiPrincipalId:
          type: string
          description: PII Principal-provided identifier. E.g., email address.
        tenantDomain:
          type: string
          description: Tenant domain of the service (SP).
        state:
          type: string
          description: Current state of the receipt.
        piiControllers:
          type: array
          description: An array that contains one or more items where each item represents
            one PII Controller.
          items:
            $ref: "#/components/schemas/piiController"
        policyUrl:
          type: string
          description: A link to the PII Controller’s privacy statement/policy and
            applicable terms of use in effect when the consent was obtained, and
            the receipt was issued.
        services:
          type: array
          description: An array that contains one or more items where each item represents
            one Service.
          items:
            $ref: "#/components/schemas/serviceResponse"
        sensitive:
          type: boolean
          description: Indicates whether the consent interaction contains PII that is
            designated sensitive or not sensitive.
        spiCat:
          type: array
          description: A listing of categories where PII data collected is sensitive.
          items:
            type: string
    service:
      type: object
      properties:
        service:
          type: string
          description: The service or group of services being provided for which PII is
            collected. The name of the service for which consent for the
            collection, use, and disclosure of PII is being provided.
        serviceDisplayName:
          type: string
          description: display name of the service
        serviceDescription:
          type: string
          description: Description about the service
        tenantDomain:
          type: string
          description: Tenant domain of the SP
        purposes:
          type: array
          items:
            $ref: "#/components/schemas/purpose"
    serviceResponse:
      type: object
      properties:
        service:
          type: string
          description: The service or group of services being provided for which PII is
            collected. The name of the service for which consent for the
            collection, use, and disclosure of PII is being provided.
        serviceDisplayName:
          type: string
          description: display name of the service
        serviceDescription:
          type: string
          description: Description about the service
        tenantDomain:
          type: string
          description: Tenant domain of the SP
        purposes:
          type: array
          items:
            $ref: "#/components/schemas/purposeResponse"
    purpose:
      type: object
      required:
        - thirdPartyDisclosure
        - thirdPartyName
        - termination
        - piiCategoryId
        - purposeCategoryId
      properties:
        purposeId:
          type: integer
          description: A unique Id of purpose
        purposeCategoryId:
          type: array
          description: The reason the PII Controller is collecting the PII.
          items:
            type: integer
        consentType:
          type: string
          description: The type of the consent used by the PII Controller as their
            authority to collect, use or disclose PII.
        piiCategory:
          type: array
          description: A list of defined PII categories Ids.
          items:
            $ref: "#/components/schemas/piiCategoryList"
        primaryPurpose:
          type: boolean
          description: Indicates if a purpose is part of the core service of the PII
            Controller. Possible values are TRUE or FALSE.
        termination:
          type: string
          description: Conditions for the termination of consent. Link to policy defining
            how consent or purpose is terminated.
        thirdPartyDisclosure:
          type: boolean
          description: Indicates if the PII Controller is disclosing PII to a third
            party.  Possible values are TRUE or FALSE.
        thirdPartyName:
          type: string
          description: The name or names of the third party to which the PII Processor may
            disclose the PII.
    purposeResponse:
      type: object
      required:
        - thirdPartyDisclosure
        - thirdPartyName
        - termination
        - piiCategory
        - purposeCategory
      properties:
        purpose:
          type: string
          description: A short, clear explanation of why the PII item is required.
        purposeId:
          type: integer
          description: Id of the purpose.
        purposeCategory:
          type: array
          description: The reason the PII Controller is collecting the PII.
          items:
            type: string
        consentType:
          type: string
          description: The type of the consent used by the PII Controller as their
            authority to collect, use or disclose PII.
        piiCategory:
          type: array
          description: A list of defined PII categories Ids.  PII Category should reflect
            the category that will be shared as understood by the PII Principal.
          items:
            $ref: "#/components/schemas/piiCategoryNameList"
        primaryPurpose:
          type: boolean
          description: Indicates if a purpose is part of the core service of the PII
            Controller. Possible values are TRUE or FALSE.
        termination:
          type: string
          description: Conditions for the termination of consent. Link to policy defining
            how consent or purpose is terminated.
        thirdPartyDisclosure:
          type: boolean
          description: Indicates if the PII Controller is disclosing PII to a third
            party.  Possible values are TRUE or FALSE.
        thirdPartyName:
          type: string
          description: The name or names of the third party to which the PII Processor may
            disclose the PII.
    purposeListResponse:
      type: object
      properties:
        purposeId:
          type: integer
        purpose:
          type: string
        description:
          type: string
        group:
          type: string
        groupType:
          type: string
    purposeGetResponse:
      type: object
      properties:
        purposeId:
          type: integer
        purpose:
          type: string
        description:
          type: string
        group:
          type: string
        groupType:
          type: string
        piiCategories:
          type: array
          items:
            $ref: "#/components/schemas/purposePiiCategoryListResponse"
    purposeCategoryListResponse:
      type: object
      properties:
        purposeCategoryId:
          type: integer
        purposeCategory:
          type: string
        description:
          type: string
    piiCategoryList:
      type: object
      properties:
        piiCategoryId:
          type: integer
        validity:
          type: string
    piiCategoryNameList:
      type: object
      properties:
        piiCategoryName:
          type: string
        piiCategoryId:
          type: integer
        validity:
          type: string
        piiCategoryDisplayName:
          type: string
    piiCategoryListResponse:
      type: object
      properties:
        piiCategoryId:
          type: integer
        piiCategory:
          type: string
        description:
          type: string
        displayName:
          type: string
        sensitive:
          type: boolean
    purposePiiCategoryListResponse:
      type: object
      properties:
        piiCategoryId:
          type: integer
        piiCategory:
          type: string
        description:
          type: string
        displayName:
          type: string
        sensitive:
          type: boolean
        mandatory:
          type: boolean
    address:
      type: object
      description: The physical address of PII controller. Postal address for
        contacting the PII Controller. This is compliant with the schema
        https://schema.org/PostalAddress.
      properties:
        addressCountry:
          type: string
        addressLocality:
          type: string
        addressRegion:
          type: string
        postOfficeBoxNumber:
          type: string
        postalCode:
          type: string
        streetAddress:
          type: string
    piiController:
      type: object
      required:
        - address
        - piiController
        - contact
        - email
        - phone
      properties:
        piiController:
          type: string
          description: Name of the first PII Controller who collects the data. This entity
            is accountable for compliance with the management of PII. The PII
            Controller determines the purpose(s) and type(s) of PII processing.
        contact:
          type: string
          description: Contact name of the PII Controller. This field MUST contain a
            non-empty string.
        address:
          $ref: "#/components/schemas/address"
        email:
          type: string
          description: Contact email address of the PII Controller. The direct email to
            contact the PII Controller regarding the consent or privacy
            contract.
        phone:
          type: string
          description: Contact phone number of the PII Controller. The business phone
            number to contact the PII Controller regarding the consent.
        onBehalf:
          type: boolean
          description: A PII Processor acting on behalf of a PII Controller or PII
            Processor. For example, a third-party analytics service would be a
            PII Processor on behalf of the PII Controller, or a site operator
            acting on behalf of the PII Controller.
        piiControllerUrl:
          type: string
          description: A URL for contacting the PII Controller.
