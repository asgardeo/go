        -H "Authorization: Basic <Base64Encoded[username:password]>" -H "accept:
        application/json"
      x-wso2-curl: >
        curl -k -X GET
        "https://localhost:9443/api/identity/consent-mgt/v1.0/consents/pii-categories?limit=10&offset=0"
        -H "Authorization: Basic YWRtaW46YWRtaW4=" -H "accept: application/json"
      x-wso2-response: >
        [{"piiCategoryId":1,"piiCategory":"email","description":"user
        email","sensitive":false},{"piiCategoryId":2,
        "piiCategory":"username","description":"user name","sensitive":false}]
      summary: |
        Retrieve all PII categories
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/piiCategories"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      tags:
        - PII Category
