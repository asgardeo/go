  /consents/pii-categories:
    post:
      description: |
        This API is used to add a new PII category for consent management.
      x-wso2-request: >
        curl -k -X POST
        "https://localhost:9443/api/identity/consent-mgt/v1.0/consents/pii-categories"
        -H "Authorization: Basic <Base64Encoded[username:password]>" -H "accept:
        application/json" -H "Content-Type: application/json" -d "{
        \"<PII_Category_Name>\": <Attributes>}"
      x-wso2-curl: >
        curl -k -X POST
        "https://localhost:9443/api/identity/consent-mgt/v1.0/consents/pii-categories"
        -H "Authorization: Basic YWRtaW46YWRtaW4=" -H "accept: application/json"
        -H "Content-Type: application/json" -d "{ \"piiCategory\": \"email\",
        \"description\": \"user email\", \"sensitive\": false}"
      x-wso2-response: >
        {"piiCategoryId":1,"piiCategory":"email","description":"user
        email","sensitive":false}
      summary: |
        Add PII category
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PIIcategoryRequest"
        description: This represents the PII catogory name.
        required: true
      responses:
        "201":
          description: Successful response
          headers:
            Location:
              description: Location of the newly created PII category
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/piiCategoryListResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      tags:
        - PII Category
    get:
      description: |
        This API is used to retrieve all PII categories.
      x-wso2-request: >
        curl -k -X GET
