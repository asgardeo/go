        curl -k -X DELETE
        "https://localhost:9443/api/identity/consent-mgt/v1.0/consents/pii-categories/1"
        -H "Authorization: Basic YWRtaW46YWRtaW4=" -H "accept: application/json"
      x-wso2-response: |
        "HTTP/1.1 200 Ok"
