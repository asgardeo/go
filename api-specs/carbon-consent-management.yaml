openapi: 3.0.0
info:
  version: 1.0.0
  title: "WSO2 Identity Server Consent Management Rest API "
  description: >
    This document specifies a **Consent Management RESTfulAPI** for WSO2
    **Identity Server** .


    It is written with [swagger 2](http://swagger.io/).
  contact:
    name: WSO2
    url: http://wso2.com/products/identity-server/
    email: architecture@wso2.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
paths:
  /consents:
    post:
      description: |
        This API is used to store consent information given by the user.
      x-wso2-request: >
        curl -k -X POST
        "https://localhost:9443/api/identity/consent-mgt/v1.0/consents" -H
        "Authorization: Basic <Base64Encoded[username:password]>" -H "accept:
        application/json" -H "Content-Type: application/json" -d "{\"services\":
        [ { \"service\": \"<Service_Name>\", \"tenantDomain\":
        \"<Tenant_Domain_Name>\", \"purposes\": [ { \"purposeId\": <Purpose_ID>,
        \"purposeCategoryId\": [ <Purpose_Category_ID> ], \"consentType\":
        \"<Consent_Type>\", \"piiCategory\": [ { \"piiCategoryId\":
        <PII_Category_ID>, \"validity\": \"days:<Number_Of_Days>\" }, {
        \"piiCategoryId\": <PII_Category_ID>, \"validity\":
        \"days:<Number_Of_Days>\" } ], \"primaryPurpose\": true,
        \"termination\": \"days:<Number_Of_Days>\", \"thirdPartyDisclosure\":
        false, \"thirdPartyName\": \"\" } ] } ], \"collectionMethod\":
        \"<Collection_Method>\", \"jurisdiction\": \"<Jurisdiction>\",
        \"language\": \"<Language_Abbreviation>\", \"policyURL\":
        \"<Service_Policy_URL>", \"properties\": [ { \"key\":
        \"<PII_Controller's_Public_Key>\", \"value\": \"v1\" } ]}"
      x-wso2-curl: >
        curl -k -X POST
        "https://localhost:9443/api/identity/consent-mgt/v1.0/consents" -H
        "Authorization: Basic YWRtaW46YWRtaW4=" -H "accept: application/json" -H
        "Content-Type: application/json" -d "{\"services\": [ { \"service\":
        \"foo-service\", \"tenantDomain\": \"carbon.super\", \"purposes\": [ {
        \"purposeId\": 1, \"purposeCategoryId\": [ 1 ], \"consentType\":
        \"EXPLICIT\", \"piiCategory\": [ { \"piiCategoryId\": 1, \"validity\":
        \"days:30\" }, { \"piiCategoryId\": 2, \"validity\": \"days:30\" } ],
        \"primaryPurpose\": true, \"termination\": \"days:30\",
        \"thirdPartyDisclosure\": false, \"thirdPartyName\": \"\" } ] } ],
        \"collectionMethod\": \"Sign-Up\", \"jurisdiction\": \"CA\",
        \"language\": \"EN\", \"policyURL\": \"https://foo.com/privacy\",
        \"properties\": [ { \"key\": \"k1\", \"value\": \"v1\" } ]}"
      x-wso2-response: >
        {"consentReceiptId":"38279263-f385-4252-8966-40998faa95ae","collectionMethod":"Sign-Up","language":"EN","piiPrincipalId":"admin","tenantDomain":"carbon.super"}
      summary: |
        Add consent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentRequest"
        description: This represents the consent element that needs to be stored.
        required: true
      responses:
        "201":
          description: Successful response
          headers:
            Location:
              description: Location of the newly created consent.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentAddResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      tags:
        - Consent
    get:
      description: >
        This API is used to list consent elements based on the filtered
        attributes.
      x-wso2-request: >
        curl -k -X GET
        "https://localhost:9443/api/identity/consent-mgt/v1.0/consents?limit=<Limit_Number>&offset=<Offset_Number>&piiPrincipalId=<PII_Principal_Name>&spTenantDomain=<Tenant_Domain>&service=<Service_Name>*&state=<ACTIVE/REVOKED>"
        -H "Authorization: Basic <Base64Encoded[username:password]>" -H "accept:
        application/json"
      x-wso2-curl: >
        curl -k -X GET
        "https://localhost:9443/api/identity/consent-mgt/v1.0/consents?limit=10&offset=0&piiPrincipalId=testuser&spTenantDomain=carbon.super&service=foo*&state=ACTIVE"
        -H "Authorization: Basic YWRtaW46YWRtaW4=" -H "accept: application/json"
      x-wso2-response: >
        [{"consentReceiptID":"7a6886ab-b02f-424f-9cd4-adf5e92f0798","language":"EN","piiPrincipalId":"testuser","tenantDomain":"carbon.super","state":"ACTIVE"}]
      summary: |
        List Consents
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/piiPrincipalId"
        - $ref: "#/components/parameters/spTenantDomain"
        - $ref: "#/components/parameters/service"
        - $ref: "#/components/parameters/state"
      responses:
        "200":
          description: OK
          headers:
            Location:
              description: Location to retireve the consent element to.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConsentResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      tags:
        - Consent
  "/consents/receipts/{receiptId}":
    delete:
      description: |
        This API is used to revoke consent.
      x-wso2-request: >
        curl -k -X DELETE
        "https://localhost:9443/api/identity/consent-mgt/v1.0/consents/receipts/<Consent_Receipt_ID>"
        -H "Authorization: Basic <Base64Encoded[username:password]>" -H "accept:
        application/json"
      x-wso2-curl: >
        curl -k -X DELETE
        "https://localhost:9443/api/identity/consent-mgt/v1.0/consents/receipts/7a6886ab-b02f-424f-9cd4-adf5e92f0798"
        -H "Authorization: Basic YWRtaW46YWRtaW4=" -H "accept: application/json"
      x-wso2-response: |
        "HTTP/1.1 200 Ok"
      summary: |
        Revoke consent
      parameters:
        - name: receiptId
          in: path
          description: This represents the Revoke Receipt ID.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      tags:
        - Consent
    get:
      description: |
        This API is used to retrieve consent using the conset receipt ID.
      x-wso2-request: >
        curl -k -X GET
        "https://localhost:9443/api/identity/consent-mgt/v1.0/consents/receipts/<Consent_Receipt_ID>"
        -H "Authorization: Basic <Base64Encoded[username:password]>" -H "accept:
        application/json"
      x-wso2-curl: >
        curl -k -X GET
        "https://localhost:9443/api/identity/consent-mgt/v1.0/consents/receipts/7a6886ab-b02f-424f-9cd4-adf5e92f0798"
        -H "Authorization: Basic YWRtaW46YWRtaW4=" -H "accept: application/json"
      x-wso2-response: >
        {"version":"KI-CR-v1.1.0","jurisdiction":"CA","consentTimestamp":1517742624682,"collectionMethod":"Sign-Up","consentReceiptID":"7a6886ab-b02f-424f-9cd4-adf5e92f0798","publicKey":null,"language":"EN","piiPrincipalId":"testuser","tenantDomain":"carbon.super","state":"ACTIVE","piiControllers":[{"piiController":"sample","contact":"sample","address":{"addressCountry":"USA","addressLocality":"Mountain
        View","addressRegion":"CA","postOfficeBoxNumber":"233","postalCode":"94043","streetAddress":"1600
        Amphitheatre
        Pkwy"},"email":"sample@abc.com","phone":"+01433444333","onBehalf":false,"piiControllerUrl":"https://sample.piicontroller.url"}],"policyUrl":"https://foo.com/privacy","services":[{"service":"foo-service","tenantDomain":"carbon.super","purposes":[{"purpose":"Contact","purposeCategory":["Legal"],"consentType":"EXPLICIT","piiCategory":[{"piiCategory":"email","validity":"days:30"},{"piiCategory":"username","validity":"days:30"}],"primaryPurpose":true,"termination":"days:30","thirdPartyDisclosure":false,"thirdPartyName":""}]}],"sensitive":false,"spiCat":null}
      summary: |
        Retrieve a consent receipt
      parameters:
        - $ref: "#/components/parameters/receiptId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentReceipt"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      tags:
        - Consent
  /consents/purposes:
    post:
      description: |
        This API is used to add a new purpose for consent management.
      x-wso2-request: >
        curl -k -X POST
        "https://localhost:9443/api/identity/consent-mgt/v1.0/consents/purposes"
        -H "Authorization: Basic <Base64Encoded[username:password]>" -H "accept:
        application/json" -H "Content-Type: application/json" -d "{ \"purpose\":
        \"<Purpose_Name>\", \"description\": \"<Purpose_Description>\",
        \"group\": \"<Purpose_Group>\", \"groupType\": \"<Purpose_Group_Type\",
        \"piiCategories\": [{\"piiCategoryId\": <PII_Category_Id>,
        \"mandatory\": <Is_Mandatory>}]}"
      x-wso2-curl: >
        curl -k -X POST
        "https://localhost:9443/api/identity/consent-mgt/v1.0/consents/purposes"
        -H "Authorization: Basic YWRtaW46YWRtaW4=" -H "accept: application/json"
        -H "Content-Type: application/json" -d "{ \"purpose\": \"Contact\",
        \"description\": \"Contact the user\", \"group\": \"SIGNIN\",
        \"groupType\": \"SYSTEM\", "piiCategories\": {\"piiCategoryId\": 1,
        \"mandatory\": true}}"
      x-wso2-response: >
        {"purposeId":1,"purpose":"Contact","description":"Contact the
        user","piiCategories":[{"piiCategoryId":1,"piiCategory":"email","description":"user
        email","sensitive":false,
        "mandatory":true},{"piiCategoryId":2,"piiCategory":"username","description":"user
        name","sensitive":false, "mandatory":false}]}
      summary: |
        Add purpose
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurposeRequest"
        description: This represents the purpose element that needs to be stored.
        required: true
      responses:
        "201":
          description: Successful response
          headers:
            Location:
              description: Location of the newly created purpose.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/purposeGetResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      tags:
        - Purpose
    get:
      description: |
        This API is used to retrieve all purposes.
      x-wso2-request: >
        curl -k -X GET
        "https://localhost:9443/api/identity/consent-mgt/v1.0/consents/purposes?group=<Group>&groupType=<Group_Type>limit=<Limit_Number>&offset=<Offset_Number>"
        -H "Authorization: Basic <Base64Encoded[username:password]>" -H "accept:
        application/json" -H "Content-Type: application/json"
      x-wso2-curl: >
        curl -k -X GET
        "https://localhost:9443/api/identity/consent-mgt/v1.0/consents/purposes?group=SIGNUP&groupType=SYSTEM&limit=10&offset=0"
        -H "Authorization: Basic YWRtaW46YWRtaW4=" -H "accept: application/json"
        -H "Content-Type: application/json"
      x-wso2-response: >
        [{"purposeId":1,"purpose":"Contact","description":"Contact the
        user","piiCategories":[]},{"purposeId":2,"purpose":"Marketing","description":"Sending
        marketing materials"}]
      summary: |
        Retrieve all purposes
      parameters:
        - $ref: "#/components/parameters/group"
        - $ref: "#/components/parameters/groupType"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/purposes"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      tags:
        - Purpose
  "/consents/purposes/{purposeId}":
    get:
      description: |
        This API is used to retrieve a specific purpose using the purpose ID.
      x-wso2-request: >
        curl -k -X GET
        "https://localhost:9443/api/identity/consent-mgt/v1.0/consents/purposes/<Purpose_ID>"
        -H "Authorization: Basic <Base64Encoded[username:password]>" -H "accept:
        application/json" -H "Content-Type: application/json"
      x-wso2-curl: >
        curl -k -X GET
        "https://localhost:9443/api/identity/consent-mgt/v1.0/consents/purposes/1"
        -H "Authorization: Basic YWRtaW46YWRtaW4=" -H "accept: application/json"
        -H "Content-Type: application/json"
      x-wso2-response: >
        {"purposeId":1,"purpose":"Contact","description":"Contact the
        user","piiCategories":[{"piiCategoryId":1,"piiCategory":"email","description":"user
        email","sensitive":false},{"piiCategoryId":2,"piiCategory":"username","description":"user
        name","sensitive":false, "mandatory":false}]}
      summary: |
        Retrieve a purpose
      parameters:
        - name: purposeId
          in: path
          description: Id of the purpose
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/purposeGetResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      tags:
        - Purpose
    delete:
      description: |
        This API is used to delete a purpose.
      x-wso2-request: >
        curl -k -X DELETE
        "https://localhost:9443/api/identity/consent-mgt/v1.0/consents/purposes/<Purpose_ID>"
        -H "Authorization: Basic <Base64Encoded[username:password]>" -H "accept:
        application/json"
      x-wso2-curl: >
        curl -k -X DELETE
        "https://localhost:9443/api/identity/consent-mgt/v1.0/consents/purposes/1"
        -H "Authorization: Basic YWRtaW46YWRtaW4=" -H "accept: application/json"
      x-wso2-response: |
        "HTTP/1.1 200 Ok"
      summary: |
        Delete a purpose
      parameters:
        - name: purposeId
          in: path
          description: Unique ID of the purpose
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      tags:
        - Purpose
  /consents/purpose-categories:
    post:
      description: |
        This API is used to add a new purpose category for consent management.
      x-wso2-request: >
        curl -k -X POST
        "https://localhost:9443/api/identity/consent-mgt/v1.0/consents/purpose-categories"
        -H "Authorization: Basic <Base64Encoded[username:password]>" -H "accept:
        application/json" -H "Content-Type: application/json" -d "{
        \"purposeCategory\": \"<Category_Name>\", \"description\":
        \"<Category_Description>\"}"
      x-wso2-curl: >
        curl -k -X POST
        "https://localhost:9443/api/identity/consent-mgt/v1.0/consents/purpose-categories"
        -H "Authorization: Basic YWRtaW46YWRtaW4=" -H "accept: application/json"
        -H "Content-Type: application/json" -d "{ \"purposeCategory\":
        \"Marketing\", \"description\": \"For marketing related activities\"}"
      x-wso2-response: >
        {"purposeCategoryId":1,"purposeCategory":"Marketing","description":"For
        marketing related activities"}
      summary: |
        Add purpose category
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurposeCategoryRequest"
        description: This represents the purpose category name.
        required: true
      responses:
        "201":
          description: Successful response
          headers:
            Location:
              description: Location of the newly created purpose category.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/purposeCategoryListResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      tags:
        - Purpose Category
    get:
      description: |
        This API is used to retrieve  all purpose categories.
      x-wso2-request: >
        curl -k -X GET
        "https://localhost:9443/api/identity/consent-mgt/v1.0/consents/purpose-categories?limit=<LimitNumber>&offset=<OffsetNumber>"
        -H "Authorization: Basic <Base64Encoded[username:password]>" -H "accept:
        application/json"
      x-wso2-curl: >
