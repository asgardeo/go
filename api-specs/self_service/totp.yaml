openapi: 3.0.0
info:
  description: >
    This is the RESTful API for a user to manage his/her TOTP QR URLs/secrets in
    WSO2 Identity Server. Going forward this will be the API for user portal as
    well as external parties.
  version: v1
  title: WSO2 Identity Server - TOTP API Definition
  contact:
    name: WSO2
    url: http://wso2.com/products/identity-server/
    email: architecture@wso2.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
security:
  - OAuth2: []
  - BasicAuth: []
tags:
  - name: me
    description: Operations for the authenticated user.
paths:
  /me/totp:
    post:
      description: |
        This API is used to perform following actions.
        * <b>INIT</b>- Generate TOTP QR code URL for the authenticated user
        * <b>REFRESH</b> - Refresh TOTP secret key of the authenticated user
        * <b>VALIDATE</b> - Validate the user entered verification code

        <b>Permission required:</b>
            * none
        <b>Scope required:</b>
            * internal_login
      summary: |
        Refresh, validate the QR code URL
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequest"
        description: Actions supported by the API. Actions can be INIT, VALIDATE or REFRESH
        required: true
      responses:
        "200":
          description: TOTP secret successfully refreshed
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
        "403":
          description: Resource Forbidden
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      tags:
        - me
    get:
      tags:
        - me
      summary: Retrieve the QR Code URL of the authenticated user.
      description: |
        This API is used to retrieve the QR code URL of the authenticated user.


        <b>Permission required:</b>
            * none
        <b>Scope required:</b>
            * internal_login
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPResponse"
        "401":
          description: Unauthorized
        "403":
          description: Resource Forbidden
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - me
      summary: Resets TOTP credentials of the authenticated user.
      description: >
        This API is used to delete the TOTP credentials of the authenticated
        user.


        <b>Permission required:</b><br> * none<br> <b>Scope required:</b><br> * internal_login
      responses:
        "200":
          description: Credentials deleted successfully
        "401":
          description: Unauthorized
        "403":
          description: Resource Forbidden
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /me/totp/secret:
    get:
      tags:
        - me
      summary: Retrieve the TOTP secret of the authenticated user.
      description: >
        This API is used to retrieve the TOTP secret of the authenticated user.


        <b>Permission required:</b><br> * none<br> <b>Scope required:</b><br> * internal_login
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPSecretResponse"
        "401":
          description: Unauthorized
        "403":
          description: Resource Forbidden
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
servers:
  - url: https://localhost:9443/t/{tenant-domain}/api/users/v1
    variables:
      tenant-domain:
        default: unknown
components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://localhost:9443/oauth2/authorize
          tokenUrl: https://localhost:9443/oauth2/token
          scopes: {}
  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: some_error_code
        message:
          type: string
          example: Some Error Message
        description:
          type: string
          example: Some Error Description
        traceId:
          type: string
          example: Some Correlation for Error Instance
    UserRequest:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          example: INIT, REFRESH, VALIDATE
          enum:
            - INIT
            - REFRESH
            - VALIDATE
        verificationCode:
          type: integer
          example: Verification code that need to be verified by the server
    TOTPResponse:
      type: object
      properties:
        qrCodeUrl:
          type: string
          description: QR Code URL for the authenticated user
        isValid:
          type: boolean
          description: Secret key of the authenticated user
    TOTPSecretResponse:
      type: object
      properties:
        secret:
          type: string
          description: Refreshed TOTP secret key of the authenticated user
