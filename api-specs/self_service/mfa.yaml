openapi: 3.0.0
info:
  description: >
    This is the RESTful API for a user to manage enabled authenticators for MFA
    in WSO2 Identity Server. Going forward this will be the API for my account
    as well as external parties.
  version: v1
  title: WSO2 Identity Server -MFA API Definition
  contact:
    name: WSO2
    url: http://wso2.com/products/identity-server/
    email: architecture@wso2.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
security:
  - OAuth2: []
  - BasicAuth: []
tags:
  - name: me
    description: Operations for the authenticated user.
paths:
  /me/mfa/authenticators:
    post:
      description: |
        This API is used to perform following actions.
        * Update Enabled Authenticators of the user.

        <b>Permission required:</b>
            * none
        <b>Scope required:</b>
            * internal_login
      summary: |
        Update Enabled Authenticators of the user.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnabledAuthenticators"
        description: Enable authenticators
        required: true
      responses:
        "200":
          description: Enabled authenticators successfully updated
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnabledAuthenticators"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      tags:
        - me
    get:
      tags:
        - me
      summary: Retrieve enabled authenticators of the authenticated user.
      description: >
        This API is used to retrieve enabled authenticators of the authenticated
        user.



        <b>Permission required:</b>
            * none
        <b>Scope required:</b>
            * internal_login
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnabledAuthenticators"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
servers:
  - url: https://localhost:9443/t/{tenant-domain}/api/users/v1
    variables:
      tenant-domain:
        default: unknown
components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://localhost:9443/oauth2/authorize
          tokenUrl: https://localhost:9443/oauth2/token
          scopes: {}
  schemas:
    Error:
      type: object
      description: MFA error.
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: some_error_code
          description: Error code.
        message:
          type: string
          example: Some Error Message
          description: Error message.
        description:
          type: string
          example: Some Error Description
          description: Error description.
        traceId:
          type: string
          example: Some Correlation for Error Instance
          description: Error trace id.
    EnabledAuthenticators:
      type: object
      required:
        - enabledAuthenticators
      description: Enabled authenticators.
      properties:
        enabledAuthenticators:
          type: string
          example: TOTP
          description: Enabled authenticators.
