openapi: 3.0.0
info:
  description: >
    This is the RESTful API for a user to manage backup codes in WSO2 Identity
    Server.
  version: v1
  title: WSO2 Identity Server - Backup Code API Definition
  contact:
    name: WSO2 Identity Server
    url: https://wso2.com/identity-and-access-management
    email: architecture@wso2.org
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
security:
  - OAuth2: []
  - BasicAuth: []
tags:
  - name: me
    description: Operations for the authenticated user.
paths:
  /me/backup-codes:
    post:
      description: |
        This API is used to generate backup codes.

        <b>Permission required:</b>
            * none
        <b>Scope required:</b>
            * internal_login
      summary: |
        Generate backup codes
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupCodeResponse"
        "401":
          description: Unauthorized
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      tags:
        - me
    get:
      tags:
        - me
      summary: Retrieve the count of remaining backup codes of the authenticated user.
      description: >
        This API is used to retrieve the count of remaining backup codes of the
        authenticated user.



        <b>Permission required:</b>
            * none
        <b>Scope required:</b>
            * internal_login
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemainingBackupCodeResponse"
        "401":
          description: Unauthorized
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - me
      summary: Delete Backup codes of the authenticated user.
      description: >
        This API is used to delete backup codes of the authenticated user.


        <b>Permission required:</b><br> * none<br> <b>Scope required:</b><br> * internal_login
      responses:
        "204":
          description: Backup codes deleted successfully.
        "401":
          description: Unauthorized
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
servers:
  - url: https://localhost:9443/t/{tenant-domain}/api/users/v1
    variables:
      tenant-domain:
        default: unknown
components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://localhost:9443/oauth2/authorize
          tokenUrl: https://localhost:9443/oauth2/token
          scopes: {}
  schemas:
    Error:
      type: object
      description: Backup code error.
      required:
        - code
        - message
        - traceId
      properties:
        code:
          type: string
          example: some_error_code
          description: Error code.
        message:
          type: string
          example: Some Error Message
          description: Error message.
        description:
          type: string
          example: Some Error Description
          description: Error description.
        traceId:
          type: string
          example: Some Correlation for Error Instance
          description: Error trace id.
    BackupCodeResponse:
      type: object
      description: Backup code response.
      properties:
        backupCodes:
          type: array
          description: Backup codes of the authenticated user.
          items:
            type: string
            example: 123456
    RemainingBackupCodeResponse:
      type: object
      description: Remaining backup code response.
      properties:
        remainingBackupCodesCount:
          description: Remaining backup codes of the authenticated user.
          type: integer
          example: 4
